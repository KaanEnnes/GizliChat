<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>GizliChat — PC</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --border: #e2e6f0;
    --text: #0f172a;
    --text-muted: #475569;
    --text-faint: #9aa2ba;
    --identity: #2e5aac;
    --identity-text: #ffffff;
    --bubble-mine: #dce8fb;
    --bubble-other: #ffffff;
    --danger: #dc2626;
    --danger-soft: #fbe4e6;
    --warning: #d97706;
    --warning-soft: #fdf1de;
  }
  /* Same dark palette as the mobile app's ThemeContext.tsx (DARK) — kept in
     sync by hand since this file has no build step to share it from. */
  :root[data-theme="dark"] {
    --bg: #0b132b;
    --surface: #1c2541;
    --border: rgba(148,163,184,0.16);
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --text-faint: rgba(148,163,184,0.5);
    --identity: #3d63b8;
    --identity-text: #f8fafc;
    --bubble-mine: #25355f;
    --bubble-other: #1c2541;
    --danger: #f87171;
    --danger-soft: rgba(248,113,113,0.14);
    --warning: #fbbf24;
    --warning-soft: rgba(251,191,36,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; }
  .hidden { display: none !important; }

  /* ---- Auth screen ---- */
  #authScreen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .authCard {
    width: 340px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
  }
  .authCard h1 { font-size: 20px; margin: 0 0 4px; }
  .authCard p.sub { color: var(--text-muted); font-size: 13px; margin: 0 0 20px; }
  .authCard input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 14px;
  }
  .authCard button.primary {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--identity);
    color: var(--identity-text);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
  }
  .authCard button.primary:disabled { opacity: .6; cursor: default; }
  .authToggle {
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    color: var(--identity);
    cursor: pointer;
  }
  .authError { color: var(--danger); font-size: 12.5px; margin-bottom: 10px; }

  /* ---- Main layout ---- */
  #mainScreen { display: flex; flex: 1; min-height: 0; }
  #sidebar {
    width: 300px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }
  #sidebarHeader {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #sidebarHeader .who { font-weight: 700; font-size: 15px; }
  #sidebarHeader .who span { color: var(--text-muted); font-weight: 400; font-size: 12px; display: block; }
  #logoutBtn { background: none; border: none; color: var(--danger); font-size: 13px; cursor: pointer; }
  #quotaBanner {
    margin: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-muted);
  }
  #quotaBanner .track { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  #quotaBanner .fill { height: 100%; background: var(--identity); }
  #addContactRow { padding: 0 12px 12px; }
  #addContactRow input {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 13px;
  }
  #contactList { flex: 1; overflow-y: auto; padding: 0 8px; }
  .contactRow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 4px;
  }
  .contactRow:hover { background: var(--bg); }
  .contactRow.active { background: var(--bubble-mine); }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--identity); color: var(--identity-text);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; flex-shrink: 0; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .contactMeta { flex: 1; min-width: 0; }
  .contactMeta .name { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contactMeta .preview { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #chatArea { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chatEmpty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 14px; }
  #chatHeader {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
  }
  #chatQuota { margin: 10px 18px 0; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 11px; color: var(--text-muted); font-weight: 600; }
  #messages { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .msgRow { display: flex; margin-bottom: 8px; }
  .msgRow.mine { justify-content: flex-end; }
  .bubble {
    max-width: 60%;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
    background: var(--bubble-other);
    border: 1px solid var(--border);
  }
  .msgRow.mine .bubble { background: var(--bubble-mine); border-color: transparent; }
  .bubble img, .bubble video { max-width: 100%; border-radius: 10px; display: block; }
  .bubble .time { font-size: 10.5px; color: var(--text-faint); margin-top: 4px; text-align: right; }
  #composer {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 12px 18px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #composer input[type=text] {
    flex: 1;
    padding: 11px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 14px;
  }
  #composer button {
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    background: var(--identity);
    color: var(--identity-text);
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
  }
  #composer button.iconBtn {
    background: var(--bg);
    color: var(--text);
    padding: 10px 12px;
  }
  #uploadStatus { font-size: 12px; color: var(--text-muted); padding: 4px 18px; }
  #globalError { background: var(--danger-soft); color: var(--danger); font-size: 12.5px; padding: 8px 18px; }

  #themeToggle {
    position: fixed;
    top: 14px;
    right: 16px;
    z-index: 50;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #themeToggle:hover { opacity: 0.85; }

  /* ---- Header actions / pinned banner ---- */
  #chatHeader { justify-content: space-between; }
  #chatHeaderActions { display: flex; gap: 8px; }
  #chatHeaderActions button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  #chatHeaderActions button.hasBadge { position: relative; }
  #chatHeaderActions button.hasBadge::after {
    content: '';
    position: absolute;
    top: 3px; right: 3px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--danger);
    border: 1px solid var(--surface);
  }
  #pinnedBanner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
  }
  #pinnedBanner .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pinnedBanner .close { color: var(--text-faint); font-weight: 700; cursor: pointer; }

  /* ---- Message bubble extras: reply quote, hover actions, hidden pill ---- */
  .bubble { position: relative; }
  .msgRow { position: relative; }
  .msgActions {
    position: absolute;
    top: -14px;
    display: none;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px 4px;
  }
  .msgRow.mine .msgActions { right: 4px; }
  .msgRow:not(.mine) .msgActions { left: 4px; }
  .msgRow:hover .msgActions { display: flex; }
  .msgActions button {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 12.5px;
    padding: 2px 4px;
    color: var(--text-muted);
  }
  .replyQuote {
    border-left: 3px solid var(--identity);
    background: rgba(0,0,0,0.06);
    border-radius: 6px;
    padding: 5px 8px;
    margin-bottom: 6px;
    font-size: 12.5px;
  }
  :root[data-theme="dark"] .replyQuote { background: rgba(255,255,255,0.06); }
  .replyQuote .sender { font-weight: 700; color: var(--identity); margin-bottom: 1px; }
  .replyQuote .txt { opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hiddenPill {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--bg);
    cursor: pointer;
    min-width: 170px;
  }
  .hiddenPill .icon { font-size: 20px; }
  .hiddenPill .label { font-weight: 700; font-size: 13px; }
  .hiddenPill .hint { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .pillMsg {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
  }

  /* ---- Reply composer banner ---- */
  #replyBanner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-top: 1px solid var(--border);
    background: var(--bg);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
  }
  #replyBanner .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #replyBanner .close { color: var(--text-faint); font-weight: 700; cursor: pointer; }

  /* ---- Lightbox (hidden-photo viewer) ---- */
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: pointer;
  }
  #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }

  /* ---- Chess modal ---- */
  #chessModal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 90;
  }
  #chessCard {
    width: 420px;
    max-width: 92vw;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
  }
  #chessCard .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  #chessCard .head h3 { margin: 0; font-size: 15px; }
  #chessCard .head .btns { display: flex; gap: 10px; }
  #chessCard .head button { border: none; background: none; cursor: pointer; font-size: 15px; color: var(--text-muted); }
  #chessStatus { font-size: 12.5px; color: var(--text-muted); font-weight: 600; margin-bottom: 12px; }
  #chessBoard {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    width: 360px;
    height: 360px;
    max-width: 100%;
    aspect-ratio: 1;
    margin: 0 auto;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .chessSq {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  .chessSq.light { background: #EEEED2; }
  .chessSq.dark { background: #769656; }
  .chessSq.selected::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(246,246,105,0.6);
  }
  .chessSq.target::after {
    content: '';
    position: absolute;
    width: 26%; height: 26%;
    border-radius: 50%;
    background: rgba(20,20,20,0.28);
  }
  #chessStartBtn {
    display: block;
    margin: 16px auto 0;
    border: none;
    border-radius: 12px;
    padding: 10px 22px;
    background: var(--identity);
    color: var(--identity-text);
    font-weight: 700;
    cursor: pointer;
  }
</style>
</head>
<body>
<button id="themeToggle" title="Açık/koyu tema"></button>
<div id="app">

  <!-- AUTH -->
  <div id="authScreen">
    <div class="authCard">
      <h1>GizliChat</h1>
      <p class="sub">Bilgisayardan yazışmaya devam et.</p>
      <div id="authError" class="authError hidden"></div>
      <input id="authUsername" type="text" placeholder="Kullanıcı adı" autocomplete="username" />
      <input id="authPassword" type="password" placeholder="Şifre" autocomplete="current-password" />
      <button id="authSubmit" class="primary">Giriş yap</button>
      <div id="authToggle" class="authToggle">Hesabın yok mu? Kayıt ol</div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="mainScreen" class="hidden">
    <div id="sidebar">
      <div id="sidebarHeader">
        <div class="who" id="whoLabel">—<span id="whoSub"></span></div>
        <button id="logoutBtn">Çıkış</button>
      </div>
      <div id="quotaBanner"></div>
      <div id="addContactRow">
        <input id="addContactInput" type="text" placeholder="Kullanıcı adıyla kişi ekle, Enter'a bas" />
      </div>
      <div id="contactList"></div>
    </div>

    <div id="chatArea">
      <div id="chatEmpty">Sohbet açmak için soldan bir kişi seç.</div>
      <div id="chatHeaderWrap" class="hidden" style="display:flex; flex-direction:column; min-height:0; flex:1;">
        <div id="chatHeader">
          <span id="chatHeaderName"></span>
          <div id="chatHeaderActions">
            <button id="chessOpenBtn" title="Satranç">♟️</button>
          </div>
        </div>
        <div id="pinnedBanner" class="hidden">
          <span>📌</span>
          <span class="txt" id="pinnedBannerText"></span>
          <span class="close" id="pinnedBannerClose" title="Sabiti kaldır">✕</span>
        </div>
        <div id="chatQuota"></div>
        <div id="globalError" class="hidden"></div>
        <div id="messages"></div>
        <div id="uploadStatus" class="hidden"></div>
        <div id="replyBanner" class="hidden">
          <span>↩️</span>
          <span class="txt" id="replyBannerText"></span>
          <span class="close" id="replyBannerClose" title="Yanıtlamayı iptal et">✕</span>
        </div>
        <div id="composer">
          <button id="attachBtn" class="iconBtn" title="Fotoğraf/Video gönder">📎</button>
          <input id="fileInput" type="file" accept="image/*,video/*" class="hidden" />
          <input id="textInput" type="text" placeholder="Mesaj yaz..." />
          <button id="sendBtn">Gönder</button>
        </div>
      </div>
    </div>
  </div>

</div>

<div id="lightbox" class="hidden">
  <img id="lightboxImg" src="" />
</div>

<div id="chessModal" class="hidden">
  <div id="chessCard">
    <div class="head">
      <h3 id="chessTitle">Satranç</h3>
      <div class="btns">
        <button id="chessResetBtn" title="Sıfırla">🔄</button>
        <button id="chessCloseBtn" title="Kapat">✕</button>
      </div>
    </div>
    <div id="chessStatus"></div>
    <div id="chessBoard"></div>
    <button id="chessStartBtn" class="hidden">OYUNU BAŞLAT</button>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  onAuthStateChanged, signOut, setPersistence, browserLocalPersistence,
} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
import {
  getFirestore, doc, setDoc, getDoc, getDocs, collection, addDoc, query, where,
  orderBy, limit, onSnapshot, serverTimestamp, Timestamp, increment, deleteField,
} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
import {
  getStorage, ref, uploadBytes, getDownloadURL,
} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js';
import { Chess } from 'https://esm.sh/chess.js@1.0.4';

// Same project config as the mobile app (src/config/firebaseConfig.ts) —
// these are not secrets, just public client identifiers; access is gated
// entirely by Firestore/Storage security rules, same as the mobile client.
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDcQNyvWOHFYYxC1ToBSHdl0KS62fXAKaU',
  authDomain: 'kaanchatmercan.firebaseapp.com',
  projectId: 'kaanchatmercan',
  storageBucket: 'kaanchatmercan.firebasestorage.app',
  messagingSenderId: '710001652885',
  appId: '1:710001652885:web:5f1dcd75d07c1753efd79c',
};

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

// Auth's default persistence tries to open an IndexedDB connection, which is
// flaky enough on a file:// origin in Chrome to throw "Database is
// closing/hidden" and break login entirely. localStorage-based persistence
// avoids IndexedDB altogether and still survives a page reload.
setPersistence(auth, browserLocalPersistence).catch(() => undefined);

// ---- Theme (defaults to dark, same as the mobile app's default) ----
const THEME_STORAGE_KEY = 'gizlichat_pc_theme';
const themeToggleBtn = document.getElementById('themeToggle');

// localStorage can throw (private-browsing edge cases, restricted preview
// sandboxes) — theme preference is a nice-to-have, never worth crashing the
// whole module (and with it auth/Firestore) over.
function readStoredTheme() {
  try { return localStorage.getItem(THEME_STORAGE_KEY); } catch { return null; }
}
function writeStoredTheme(mode) {
  try { localStorage.setItem(THEME_STORAGE_KEY, mode); } catch { /* ignore */ }
}

function applyTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  themeToggleBtn.textContent = mode === 'dark' ? '☀️' : '🌙';
}
applyTheme(readStoredTheme() === 'light' ? 'light' : 'dark');
themeToggleBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  writeStoredTheme(next);
});

const USERNAME_EMAIL_DOMAIN = '@gizlichat.local';
const VIDEO_QUOTA_BYTES = 5120 * 1024 * 1024;
const usernameToEmail = u => `${u.trim().toLowerCase()}${USERNAME_EMAIL_DOMAIN}`;
const roomIdFor = (a, b) => [a, b].sort().join('__');

// ---- DOM refs ----
const $ = id => document.getElementById(id);
const authScreen = $('authScreen'), mainScreen = $('mainScreen');
const authUsername = $('authUsername'), authPassword = $('authPassword');
const authSubmit = $('authSubmit'), authToggle = $('authToggle'), authError = $('authError');
const whoLabel = $('whoLabel'), whoSub = $('whoSub'), quotaBanner = $('quotaBanner');
const addContactInput = $('addContactInput'), contactList = $('contactList');
const chatEmpty = $('chatEmpty'), chatHeaderWrap = $('chatHeaderWrap'), chatHeader = $('chatHeader');
const chatHeaderName = $('chatHeaderName');
const chatQuota = $('chatQuota'), messagesEl = $('messages'), globalError = $('globalError');
const textInput = $('textInput'), sendBtn = $('sendBtn');
const attachBtn = $('attachBtn'), fileInput = $('fileInput'), uploadStatus = $('uploadStatus');
const pinnedBanner = $('pinnedBanner'), pinnedBannerText = $('pinnedBannerText'), pinnedBannerClose = $('pinnedBannerClose');
const replyBanner = $('replyBanner'), replyBannerText = $('replyBannerText'), replyBannerClose = $('replyBannerClose');
const lightbox = $('lightbox'), lightboxImg = $('lightboxImg');
const chessOpenBtn = $('chessOpenBtn'), chessModal = $('chessModal'), chessCloseBtn = $('chessCloseBtn');
const chessResetBtn = $('chessResetBtn'), chessTitle = $('chessTitle'), chessStatusEl = $('chessStatus');
const chessBoardEl = $('chessBoard'), chessStartBtn = $('chessStartBtn');

let isRegisterMode = false;
let myUid = null, myUsername = null;
let contacts = []; // {uid, name}
let activeContactUid = null;
let activeContact = null;
let roomUnsub = null;
let contactListUnsubs = [];
let profileUnsub = null;
let pinnedUnsub = null;
let pinnedMessageId = null;
let latestMessages = []; // [{id, data}] for the currently-open room, for pin/reply jump-to lookups
let replyingTo = null; // {id, type, text, senderId}
let chessUnsub = null;
let chessGame = null; // {fen, playerWhite, playerBlack, status, outcome, updatedAt}
let chessSelected = null;
const START_FEN = new Chess().fen();
// When this session started — only messages newer than this trigger a
// desktop notification, so re-opening the app doesn't re-notify for the
// whole existing history. Tracked per contact so a burst from the same
// sender doesn't repeat the same message id twice.
const sessionStartedAt = Date.now();
const notifiedMessageIds = new Set();

function requestNotificationPermission() {
  if (typeof Notification === 'undefined' || Notification.permission !== 'default') return;
  Notification.requestPermission().catch(() => undefined);
}

/**
 * Real OS-level desktop notification with the actual sender name and
 * message content — unlike the mobile app's deliberately-disguised fake
 * game notifications, the PC client isn't hiding behind a cover app, so
 * there's no reason to hide the content here.
 */
function showDesktopNotification(contactName, bodyText) {
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  try {
    new Notification(`${contactName} adlı kişiden mesaj geldi`, { body: bodyText });
  } catch {
    // Notification construction can throw in some restricted contexts
    // (e.g. certain file:// sandboxes) — silently skip, not worth surfacing.
  }
}

function showError(msg) {
  globalError.textContent = msg;
  globalError.classList.remove('hidden');
  setTimeout(() => globalError.classList.add('hidden'), 5000);
}

function formatMb(bytes) { return Math.round(bytes / (1024 * 1024)); }
function renderQuota(el, usedBytes) {
  const usedMb = formatMb(usedBytes || 0);
  const totalMb = formatMb(VIDEO_QUOTA_BYTES);
  const ratio = Math.min(1, (usedBytes || 0) / VIDEO_QUOTA_BYTES);
  el.innerHTML = `geriye kalan video yükleme alanı: ${usedMb}mb / ${totalMb}mb
    <div class="track"><div class="fill" style="width:${ratio * 100}%"></div></div>`;
}

// ---- Auth ----
authToggle.addEventListener('click', () => {
  isRegisterMode = !isRegisterMode;
  authSubmit.textContent = isRegisterMode ? 'Kayıt ol' : 'Giriş yap';
  authToggle.textContent = isRegisterMode ? 'Zaten hesabın var mı? Giriş yap' : 'Hesabın yok mu? Kayıt ol';
});

authSubmit.addEventListener('click', async () => {
  const username = authUsername.value.trim();
  const password = authPassword.value;
  if (!username || !password) {
    authError.textContent = 'Kullanıcı adı ve şifre gerekli.';
    authError.classList.remove('hidden');
    return;
  }
  authSubmit.disabled = true;
  authError.classList.add('hidden');
  try {
    if (isRegisterMode) {
      const credential = await createUserWithEmailAndPassword(auth, usernameToEmail(username), password);
      await setDoc(doc(db, 'users', credential.user.uid), {
        username, usernameLower: username.toLowerCase(), createdAt: Date.now(),
      });

    }

    authError.textContent = mapAuthError(error);
    authError.classList.remove('hidden');
  } finally {

  }

function mapAuthError(error) {
  switch (error.code) {
    case 'auth/email-already-in-use': return 'Bu kullanıcı adı zaten alınmış.';
    case 'auth/weak-password': return 'Şifre en az 6 karakter olmalı.';
    case 'auth/user-not-found':
    case 'auth/wrong-password':
    case 'auth/invalid-credential': return 'Kullanıcı adı veya şifre hatalı.';
    default: return error.message || 'Beklenmeyen bir hata oluştu.';
  }
}

$('logoutBtn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async user => {
  if (!user) {
    myUid = null;
    authScreen.classList.remove('hidden');
    mainScreen.classList.add('hidden');
    cleanupSession();
    return;
  }
  myUid = user.uid;

function cleanupSession() {
  contactListUnsubs.forEach(u => u());
  contactListUnsubs = [];
  if (roomUnsub) roomUnsub();
  if (profileUnsub) profileUnsub();
  if (pinnedUnsub) pinnedUnsub();
  if (chessUnsub) chessUnsub();
  contacts = [];
  activeContactUid = null;
  activeContact = null;
  pinnedMessageId = null;
  latestMessages = [];
  chessGame = null;
  contactList.innerHTML = '';
  messagesEl.innerHTML = '';
  chessModal.classList.add('hidden');
}

function startSession() {
  requestNotificationPermission();

    const data = snap.data() || {};
    renderQuota(quotaBanner, data.videoBytesUsed || 0);
  });

  onSnapshot(collection(db, 'users', myUid, 'contacts'), async snapshot => {
    contacts = snapshot.docs.map(d => ({ uid: d.id, name: d.data().name || 'Kişi' }));
    contacts.sort((a, b) => a.name.localeCompare(b.name, 'tr'));

// ---- Contacts ----
addContactInput.addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const username = addContactInput.value.trim();
  if (!username) return;
  addContactInput.disabled = true;
  try {
    const q = query(collection(db, 'users'), where('usernameLower', '==', username.toLowerCase()), limit(1));
    const snap = await getDocs(q);
    if (snap.empty) { showError('Bu kullanıcı adıyla bir hesap bulunamadı.'); return; }
    const found = snap.docs[0];
    if (found.id === myUid) { showError('Kendini ekleyemezsin.'); return; }
    await setDoc(doc(db, 'users', myUid, 'contacts', found.id), {
      name: found.data().username, addedAt: Date.now(), favorite: false,
    });
    addContactInput.value = '';
  } catch (error) {
    showError(`Kişi eklenemedi: ${error.message}`);
  } finally {
    addContactInput.disabled = false;
  }
});

function renderContactList() {
  contactListUnsubs.forEach(u => u());
  contactListUnsubs = [];
  contactList.innerHTML = '';
  contacts.forEach(contact => {
    const row = document.createElement('div');
    row.className = 'contactRow' + (contact.uid === activeContactUid ? ' active' : '');
    row.innerHTML = `
      <div class="avatar" id="avatar_${contact.uid}">${contact.name.slice(0, 1).toUpperCase()}</div>
      <div class="contactMeta">
        <div class="name">${escapeHtml(contact.name)}</div>
        <div class="preview" id="preview_${contact.uid}">Henüz mesaj yok</div>
      </div>`;
    row.addEventListener('click', () => openRoom(contact));
    contactList.appendChild(row);

    const roomId = roomIdFor(myUid, contact.uid);
    const latestQ = query(collection(db, 'rooms', roomId, 'messages'), orderBy('createdAt', 'desc'), limit(1));
    contactListUnsubs.push(onSnapshot(latestQ, snap => {
      const previewEl = document.getElementById(`preview_${contact.uid}`);
      if (snap.empty) { if (previewEl) previewEl.textContent = 'Henüz mesaj yok'; return; }
      const docSnap = snap.docs[0];
      const data = docSnap.data();
      if (previewEl) previewEl.textContent = previewText(data, myUid);

      // Same suppression rule as the mobile app: no notification for a
      // message from the contact whose room is currently open on screen.
      const createdAtMs = data.createdAt instanceof Timestamp ? data.createdAt.toMillis() : Date.now();
      if (
        data.senderId !== myUid &&
        data.type !== 'call' &&
        createdAtMs > sessionStartedAt &&
        contact.uid !== activeContactUid &&
        !notifiedMessageIds.has(docSnap.id)
      ) {
        notifiedMessageIds.add(docSnap.id);
        showDesktopNotification(contact.name, previewText(data, myUid));
      }
    }));
    contactListUnsubs.push(onSnapshot(doc(db, 'users', contact.uid), snap => {
      const avatarEl = document.getElementById(`avatar_${contact.uid}`);
      if (!avatarEl) return;
      const photoUrl = snap.data()?.photoUrl;
      avatarEl.innerHTML = photoUrl ? `<img src="${photoUrl}" />` : contact.name.slice(0, 1).toUpperCase();
    }));
  });
}

function previewText(data, myUid) {
  const mine = data.senderId === myUid ? 'Sen: ' : '';
  switch (data.type) {
    case 'image': return data.hidden ? `${mine}🙈 Gizli Fotoğraf` : `${mine}📷 Fotoğraf`;
    case 'video': return `${mine}🎥 Video`;
    case 'audio': return `${mine}🎤 Sesli mesaj`;
    case 'call': return `📞 Arama`;
    case 'chess': return `${mine}♟️ Satranç daveti`;
    default: return `${mine}${data.text || ''}`;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---- Chat room ----
function openRoom(contact) {
  activeContactUid = contact.uid;
  activeContact = contact;
  chatEmpty.classList.add('hidden');
  chatHeaderWrap.classList.remove('hidden');
  chatHeaderName.textContent = contact.name;
  renderContactList();
  cancelReply();

  if (roomUnsub) roomUnsub();
  const roomId = roomIdFor(myUid, contact.uid);
  const messagesQ = query(collection(db, 'rooms', roomId, 'messages'), orderBy('createdAt', 'desc'), limit(50));
  roomUnsub = onSnapshot(messagesQ, snapshot => {
    const docs = snapshot.docs.slice().reverse();
    latestMessages = docs.map(d => ({ id: d.id, data: d.data() }));
    messagesEl.innerHTML = '';
    latestMessages.forEach(m => messagesEl.appendChild(renderMessage(m.id, m.data)));
    messagesEl.scrollTop = messagesEl.scrollHeight;
    renderPinnedBanner();
  }, error => showError(`Sohbete bağlanılamadı: ${error.message}`));

  if (pinnedUnsub) pinnedUnsub();
  pinnedUnsub = onSnapshot(doc(db, 'rooms', roomId), snap => {
    pinnedMessageId = snap.data()?.pinnedMessageId || null;
    renderPinnedBanner();
  });

  subscribeChessGame(roomId);
}

function renderPinnedBanner() {
  if (!pinnedMessageId) {
    pinnedBanner.classList.add('hidden');
    return;
  }
  const found = latestMessages.find(m => m.id === pinnedMessageId);
  if (!found) {
    pinnedBanner.classList.add('hidden');
    return;
  }
  pinnedBannerText.textContent = found.data.deleted ? 'Bu mesaj silindi' : previewText(found.data, myUid);
  pinnedBanner.classList.remove('hidden');
}

pinnedBanner.addEventListener('click', e => {
  if (e.target === pinnedBannerClose) return;
  const el = messagesEl.querySelector(`[data-msg-id="${pinnedMessageId}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
});
pinnedBannerClose.addEventListener('click', async () => {
  if (!activeContactUid) return;
  const roomId = roomIdFor(myUid, activeContactUid);
  await setDoc(doc(db, 'rooms', roomId), { pinnedMessageId: deleteField() }, { merge: true });
});

async function togglePin(messageId) {
  if (!activeContactUid) return;
  const roomId = roomIdFor(myUid, activeContactUid);
  const next = pinnedMessageId === messageId ? deleteField() : messageId;
  await setDoc(doc(db, 'rooms', roomId), { pinnedMessageId: next }, { merge: true });
}

// ---- Reply ----
function setReplyingTo(id, data) {
  replyingTo = { id, type: data.type, text: data.text || '', senderId: data.senderId };
  replyBannerText.textContent = `${data.senderId === myUid ? 'Kendine' : activeContact?.name || ''} yanıtlıyorsun: ${previewText(data, myUid)}`;
  replyBanner.classList.remove('hidden');
  textInput.focus();
}
function cancelReply() {
  replyingTo = null;
  replyBanner.classList.add('hidden');
}
replyBannerClose.addEventListener('click', cancelReply);

function replyQuoteHtml(replyTo) {
  if (!replyTo) return '';
  const senderLabel = replyTo.senderId === myUid ? 'Sen' : (activeContact?.name || 'O');
  const label = previewText({ type: replyTo.type, text: replyTo.text, senderId: replyTo.senderId }, myUid).replace(/^Sen: /, '');
  return `<div class="replyQuote"><div class="sender">${escapeHtml(senderLabel)}</div><div class="txt">${escapeHtml(label)}</div></div>`;
}

function formatTime(ts) {
  const ms = ts instanceof Timestamp ? ts.toMillis() : (typeof ts === 'number' ? ts : Date.now());
  const d = new Date(ms);
  return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
}

function renderMessage(id, data) {
  const row = document.createElement('div');
  row.className = 'msgRow' + (data.senderId === myUid ? ' mine' : '');
  row.dataset.msgId = id;

  // Call/chess entries render as a plain centered pill, same as the mobile app — no reply/pin actions on those.
  if (data.type === 'call') {
    const pill = document.createElement('div');
    pill.className = 'pillMsg';
    pill.textContent = `${data.callVideo ? '🎥 Görüntülü' : '📞 Sesli'} arama`;
    row.style.justifyContent = 'center';
    row.appendChild(pill);
    return row;
  }
  if (data.type === 'chess') {
    const pill = document.createElement('div');
    pill.className = 'pillMsg';
    pill.textContent = data.senderId === myUid ? '♟️ Satranç daveti gönderdin' : '♟️ Satranç daveti aldın';
    row.style.justifyContent = 'center';
    row.appendChild(pill);
    return row;
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = replyQuoteHtml(data.replyTo);

  if (data.deleted) {
    bubble.innerHTML += `<span style="opacity:.6;font-style:italic;">🚫 Bu mesaj silindi</span>`;
  } else if (data.type === 'image' && data.hidden && data.mediaUrl) {
    const pill = document.createElement('div');
    pill.className = 'hiddenPill';
    pill.innerHTML = `<span class="icon">🙈</span><div><div class="label">Gizli Fotoğraf</div><div class="hint">Görmek için tıkla</div></div>`;
    pill.addEventListener('click', () => {
      lightboxImg.src = data.mediaUrl;
      lightbox.classList.remove('hidden');
    });
    bubble.appendChild(pill);
  } else if (data.type === 'image' && data.mediaUrl) {
    bubble.innerHTML += `<img src="${data.mediaUrl}" />`;
  } else if (data.type === 'video' && data.mediaUrl) {
    bubble.innerHTML += `<video src="${data.mediaUrl}" controls></video>`;
  } else if (data.type === 'audio' && data.mediaUrl) {
    bubble.innerHTML += `<audio src="${data.mediaUrl}" controls></audio>`;
  } else {
    bubble.appendChild(document.createTextNode(data.text || ''));
  }

  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = formatTime(data.createdAt);
  bubble.appendChild(time);
  row.appendChild(bubble);

  if (!data.deleted) {
    const actions = document.createElement('div');
    actions.className = 'msgActions';
    const replyBtn = document.createElement('button');
    replyBtn.title = 'Yanıtla';
    replyBtn.textContent = '↩️';
    replyBtn.addEventListener('click', () => setReplyingTo(id, data));
    const pinBtn = document.createElement('button');
    pinBtn.title = pinnedMessageId === id ? 'Sabiti kaldır' : 'Sabitle';
    pinBtn.textContent = '📌';
    pinBtn.addEventListener('click', () => togglePin(id));
    actions.appendChild(replyBtn);
    actions.appendChild(pinBtn);
    row.appendChild(actions);
  }

  return row;
}

fileInput.addEventListener('change', async () => {

// ---- Chess (mirrors src/services/chessService.ts's contact-mode game, rooms/{roomId}/game/chess) ----
function chessDocRef(roomId) { return doc(db, 'rooms', roomId, 'game', 'chess'); }

function subscribeChessGame(roomId) {
  if (chessUnsub) chessUnsub();
  chessUnsub = onSnapshot(chessDocRef(roomId), snap => {
    chessGame = snap.exists() ? snap.data() : null;
    chessSelected = null;
    if (!chessModal.classList.contains('hidden')) renderChessModal();
    updateChessBadge();
  });
}

function updateChessBadge() {
  chessOpenBtn.classList.toggle('hasBadge', chessGame?.status === 'active');
}

async function startChessGame() {
  if (!activeContactUid) return;
  const roomId = roomIdFor(myUid, activeContactUid);
  await setDoc(chessDocRef(roomId), {
    fen: START_FEN, playerWhite: myUid, playerBlack: activeContactUid,
    status: 'active', outcome: null, updatedAt: serverTimestamp(),
  });
  await addDoc(collection(db, 'rooms', roomId, 'messages'), {
    type: 'chess', text: '', senderId: myUid, createdAt: serverTimestamp(),
  });
}

async function resetChessGame() {
  if (!activeContactUid || !chessGame) return;
  const roomId = roomIdFor(myUid, activeContactUid);
  await setDoc(chessDocRef(roomId), {
    fen: START_FEN, playerWhite: chessGame.playerWhite, playerBlack: chessGame.playerBlack,
    status: 'active', outcome: null, updatedAt: serverTimestamp(),
  });
}

async function playChessMove(from, to) {
  if (!activeContactUid || !chessGame || chessGame.status !== 'active') return;
  const isWhite = chessGame.playerWhite === myUid;
  const chess = new Chess(chessGame.fen);
  if ((chess.turn() === 'w') !== isWhite) return;
  try {
    chess.move({ from, to, promotion: 'q' });
  } catch {
    return; // illegal move — ignore the click rather than surface an error
  }
  let outcome = null;
  if (chess.isCheckmate()) outcome = isWhite ? 'white' : 'black';
  else if (chess.isDraw() || chess.isStalemate()) outcome = 'draw';
  const roomId = roomIdFor(myUid, activeContactUid);
  await setDoc(chessDocRef(roomId), {
    fen: chess.fen(), status: chess.isGameOver() ? 'finished' : 'active', outcome, updatedAt: serverTimestamp(),
  }, { merge: true });
}

function chessMyColor() {
  if (!chessGame) return null;
  if (chessGame.playerWhite === myUid) return 'w';
  if (chessGame.playerBlack === myUid) return 'b';
  return null;
}

const CHESS_GLYPHS = { wk: '♔', wq: '♕', wr: '♖', wb: '♗', wn: '♘', wp: '♙', bk: '♚', bq: '♛', br: '♜', bb: '♝', bn: '♞', bp: '♟' };

function renderChessModal() {
  const myColor = chessMyColor();
  const game = chessGame;
  chessTitle.textContent = `Satranç — ${activeContact?.name || ''}`;

  if (!game || game.status === 'finished') {
    chessStartBtn.classList.remove('hidden');
    chessStartBtn.textContent = game ? 'YENİDEN OYNA' : 'OYUNU BAŞLAT';
    chessStartBtn.onclick = game ? resetChessGame : startChessGame;
    chessStatusEl.textContent = game
      ? game.outcome === 'draw' ? 'Berabere'
        : (game.outcome === 'white' && myColor === 'w') || (game.outcome === 'black' && myColor === 'b') ? 'Kazandın! 🎉'
        : `${activeContact?.name || 'Rakip'} kazandı`
      : `${activeContact?.name || ''} ile yeni bir oyun başlat`;
  } else {
    chessStartBtn.classList.add('hidden');
    const isMyTurn = game.status === 'active' && !!myColor && game.fen.split(' ')[1] === myColor;
    chessStatusEl.textContent = isMyTurn ? 'Sırası sende' : `Sırası ${activeContact?.name || ''}'da`;
  }
  chessResetBtn.style.visibility = game ? 'visible' : 'hidden';

  const fen = game?.fen || START_FEN;
  const chess = new Chess(fen);
  const board = chess.board();
  const flip = myColor === 'b';
  const ranks = flip ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
  const files = flip ? ['h','g','f','e','d','c','b','a'] : ['a','b','c','d','e','f','g','h'];
  const legalTargets = chessSelected
    ? new Set(chess.moves({ square: chessSelected, verbose: true }).map(m => m.to))
    : new Set();

  chessBoardEl.innerHTML = '';
  ranks.forEach(rank => {
    files.forEach(file => {
      const square = `${file}${rank}`;
      const rankIndex = 8 - rank;
      const fileIndex = ['a','b','c','d','e','f','g','h'].indexOf(file);
      const piece = board[rankIndex]?.[fileIndex];
      const isDark = (rankIndex + fileIndex) % 2 === 1;
      const sq = document.createElement('div');
      sq.className = `chessSq ${isDark ? 'dark' : 'light'}${chessSelected === square ? ' selected' : ''}${legalTargets.has(square) ? ' target' : ''}`;
      if (piece) sq.textContent = CHESS_GLYPHS[`${piece.color}${piece.type}`];
      sq.addEventListener('click', () => handleChessSquareClick(square));
      chessBoardEl.appendChild(sq);
    });
  });
}

function handleChessSquareClick(square) {
  const myColor = chessMyColor();
  if (!myColor || !chessGame || chessGame.status !== 'active') return;
  const isMyTurn = chessGame.fen.split(' ')[1] === myColor;
  if (!isMyTurn) return;
  const chess = new Chess(chessGame.fen);
  if (chessSelected) {
    const targets = new Set(chess.moves({ square: chessSelected, verbose: true }).map(m => m.to));
    if (targets.has(square)) {
      playChessMove(chessSelected, square);
      chessSelected = null;
      renderChessModal();
      return;
    }
  }
  const piece = chess.get(square);
  chessSelected = piece && piece.color === myColor ? square : null;
  renderChessModal();
}

chessOpenBtn.addEventListener('click', () => {
  if (!activeContactUid) return;
  chessSelected = null;
  chessModal.classList.remove('hidden');
  renderChessModal();
});
chessCloseBtn.addEventListener('click', () => chessModal.classList.add('hidden'));
chessResetBtn.addEventListener('click', resetChessGame);

function resizeImageToDataUri(file, maxSize, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error('Dosya okunamadı.'));
    reader.onload = () => { img.src = reader.result; };
    img.onerror = () => reject(new Error('Görsel işlenemedi.'));
    img.onload = () => {
      let { width, height } = img;
      if (width > maxSize || height > maxSize) {
        const scale = maxSize / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    reader.readAsDataURL(file);
  });
}
</script>
