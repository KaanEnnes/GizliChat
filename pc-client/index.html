<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>GizliChat — PC</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --border: #e2e6f0;
    --text: #0f172a;
    --text-muted: #475569;
    --text-faint: #9aa2ba;
    --identity: #2e5aac;
    --identity-text: #ffffff;
    --bubble-mine: #dce8fb;
    --bubble-other: #ffffff;
    --danger: #dc2626;
    --danger-soft: #fbe4e6;
    --warning: #d97706;
    --warning-soft: #fdf1de;
  }
  /* Same dark palette as the mobile app's ThemeContext.tsx (DARK) — kept in
     sync by hand since this file has no build step to share it from. */
  :root[data-theme="dark"] {
    --bg: #0b132b;
    --surface: #1c2541;
    --border: rgba(148,163,184,0.16);
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --text-faint: rgba(148,163,184,0.5);
    --identity: #3d63b8;
    --identity-text: #f8fafc;
    --bubble-mine: #25355f;
    --bubble-other: #1c2541;
    --danger: #f87171;
    --danger-soft: rgba(248,113,113,0.14);
    --warning: #fbbf24;
    --warning-soft: rgba(251,191,36,0.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; }
  .hidden { display: none !important; }

  /* ---- Auth screen ---- */
  #authScreen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .authCard {
    width: 340px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
  }
  .authCard h1 { font-size: 20px; margin: 0 0 4px; }
  .authCard p.sub { color: var(--text-muted); font-size: 13px; margin: 0 0 20px; }
  .authCard input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 14px;
  }
  .authCard button.primary {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: var(--identity);
    color: var(--identity-text);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
  }
  .authCard button.primary:disabled { opacity: .6; cursor: default; }
  .authToggle {
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    color: var(--identity);
    cursor: pointer;
  }
  .authError { color: var(--danger); font-size: 12.5px; margin-bottom: 10px; }

  /* ---- Main layout ---- */
  #mainScreen { display: flex; flex: 1; min-height: 0; }
  #sidebar {
    width: 300px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    flex-direction: column;
  }
  #sidebarHeader {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #sidebarHeader .who { font-weight: 700; font-size: 15px; }
  #sidebarHeader .who span { color: var(--text-muted); font-weight: 400; font-size: 12px; display: block; }
  #logoutBtn { background: none; border: none; color: var(--danger); font-size: 13px; cursor: pointer; }
  #quotaBanner {
    margin: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-muted);
  }
  #quotaBanner .track { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  #quotaBanner .fill { height: 100%; background: var(--identity); }
  #addContactRow { padding: 0 12px 12px; }
  #addContactRow input {
    width: 100%;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 13px;
  }
  #contactList { flex: 1; overflow-y: auto; padding: 0 8px; }
  .contactRow {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 4px;
  }
  .contactRow:hover { background: var(--bg); }
  .contactRow.active { background: var(--bubble-mine); }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--identity); color: var(--identity-text);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; flex-shrink: 0; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .contactMeta { flex: 1; min-width: 0; }
  .contactMeta .name { font-weight: 700; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .contactMeta .preview { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #chatArea { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chatEmpty { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 14px; }
  #chatHeader {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-weight: 700;
  }
  #chatHeader .iconBtn {
    border: none;
    border-radius: 10px;
    padding: 7px 10px;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-size: 15px;
  }

  /* ---- Game modals (XOX / Chess) ---- */
  .modalOverlay {
    position: fixed;
    inset: 0;
    background: rgba(6,10,24,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modalCard {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .modalHeaderRow {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .modalTitle { font-size: 16px; font-weight: 800; }
  .modalClose {
    border: none;
    background: none;
    color: var(--text-muted);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    padding: 4px;
  }
  .modalStatus { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 16px; }
  .modalStartBtn {
    margin-top: 20px;
    border: none;
    border-radius: 14px;
    padding: 12px 26px;
    background: var(--identity);
    color: var(--identity-text);
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .pickerBtn {
    width: 100%;
    padding: 14px;
    margin-bottom: 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }

  .xoxBoard {
    display: flex;
    flex-direction: column;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .xoxRow { display: flex; }
  .xoxCell {
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 800;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    color: var(--text);
  }
  .xoxCell.win { background: rgba(217,84,0,0.15); }
  .xoxCell.x { color: var(--identity); }
  .xoxCell.o { color: #D95400; }

  .chessBoard {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 6px 14px rgba(0,0,0,0.28);
  }
  .chessRowEl { display: flex; }
  .chessSquare {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 27px;
    cursor: pointer;
    position: relative;
    user-select: none;
  }
  .chessSquare.light { background: #EEEED2; }
  .chessSquare.dark { background: #769656; }
  .chessSquare.selected::after {
    content: ''; position: absolute; inset: 0; background: rgba(246,246,105,0.85);
  }
  .chessSquare.target::after {
    content: ''; position: absolute; inset: 0; background: rgba(20,20,20,0.14);
  }
  .chessSquare .piece { position: relative; z-index: 1; }
  #chatQuota { margin: 10px 18px 0; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 11px; color: var(--text-muted); font-weight: 600; }
  #messages { flex: 1; overflow-y: auto; padding: 16px 18px; }
  #chatHeaderWrap { position: relative; }
  #scrollToBottomBtn {
    position: absolute; right: 24px; bottom: 88px; width: 40px; height: 40px;
    border-radius: 50%; border: 1px solid var(--border); background: var(--bg-panel, #fff);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; z-index: 5;
  }
  #scrollToBottomBtn.hidden { display: none; }
  .msgRow { display: flex; margin-bottom: 8px; }
  .msgRow.mine { justify-content: flex-end; }
  .bubble {
    max-width: 60%;
    padding: 9px 13px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
    background: var(--bubble-other);
    border: 1px solid var(--border);
  }
  .msgRow.mine .bubble { background: var(--bubble-mine); border-color: transparent; }
  .bubble img, .bubble video { max-width: 100%; border-radius: 10px; display: block; }
  .bubble .time { font-size: 10.5px; color: var(--text-faint); margin-top: 4px; text-align: right; }
  #composer {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 12px 18px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  #composer input[type=text] {
    flex: 1;
    padding: 11px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 14px;
  }
  #composer button {
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    background: var(--identity);
    color: var(--identity-text);
    font-weight: 700;
    cursor: pointer;
    font-size: 13px;
  }
  #composer button.iconBtn {
    background: var(--bg);
    color: var(--text);
    padding: 10px 12px;
  }
  #uploadStatus { font-size: 12px; color: var(--text-muted); padding: 4px 18px; }
  #globalError { background: var(--danger-soft); color: var(--danger); font-size: 12.5px; padding: 8px 18px; }

  #themeToggle {
    position: fixed;
    top: 14px;
    right: 16px;
    z-index: 50;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #themeToggle:hover { opacity: 0.85; }

  /* ---- Header actions / pinned banner ---- */
  #chatHeader { justify-content: space-between; }
  #chatHeaderActions { display: flex; gap: 8px; }
  #chatHeaderActions button {
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  #chatHeaderActions button.hasBadge { position: relative; }
  #chatHeaderActions button.hasBadge::after {
    content: '';
    position: absolute;
    top: 3px; right: 3px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--danger);
    border: 1px solid var(--surface);
  }
  /* Disclosed (not secret) admin-access notice — persistent, shown every
     time a chat room is opened (skipped only when admin itself is one of
     the two participants). See ObsidianVault/Changelog.md. */
  #adminDisclosureBanner {
    padding: 6px 18px;
    font-size: 11px;
    font-weight: 600;
    background: var(--warning-soft);
    color: var(--warning);
  }
  #pinnedBanner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
  }
  #pinnedBanner .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pinnedBanner .close { color: var(--text-faint); font-weight: 700; cursor: pointer; }

  /* ---- Message bubble extras: reply quote, hover actions, hidden pill ---- */
  .bubble { position: relative; }
  .msgRow { position: relative; }
  .msgActions {
    position: absolute;
    top: -14px;
    display: none;
    gap: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2px 4px;
  }
  .msgRow.mine .msgActions { right: 4px; }
  .msgRow:not(.mine) .msgActions { left: 4px; }
  .msgRow:hover .msgActions { display: flex; }
  .msgActions button {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 12.5px;
    padding: 2px 4px;
    color: var(--text-muted);
  }
  .replyQuote {
    border-left: 3px solid var(--identity);
    background: rgba(0,0,0,0.06);
    border-radius: 6px;
    padding: 5px 8px;
    margin-bottom: 6px;
    font-size: 12.5px;
  }
  :root[data-theme="dark"] .replyQuote { background: rgba(255,255,255,0.06); }
  .replyQuote .sender { font-weight: 700; color: var(--identity); margin-bottom: 1px; }
  .replyQuote .txt { opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hiddenPill {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--bg);
    cursor: pointer;
    min-width: 170px;
  }
  .hiddenPill .icon { font-size: 20px; }
  .hiddenPill .label { font-weight: 700; font-size: 13px; }
  .hiddenPill .hint { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
  .pillMsg {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
  }

  /* ---- Reply composer banner ---- */
  #replyBanner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-top: 1px solid var(--border);
    background: var(--bg);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
  }
  #replyBanner .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #replyBanner .close { color: var(--text-faint); font-weight: 700; cursor: pointer; }

  /* ---- Lightbox (hidden-photo viewer) ---- */
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    cursor: pointer;
  }
  #lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }

</style>
</head>
<body>
<button id="themeToggle" title="Açık/koyu tema"></button>
<div id="app">

  <!-- AUTH -->
  <div id="authScreen">
    <div class="authCard">
      <h1>GizliChat</h1>
      <p class="sub">Bilgisayardan yazışmaya devam et.</p>
      <div id="authError" class="authError hidden"></div>
      <input id="authUsername" type="text" placeholder="Kullanıcı adı" autocomplete="username" />
      <input id="authPassword" type="password" placeholder="Şifre" autocomplete="current-password" />
      <button id="authSubmit" class="primary">Giriş yap</button>
      <div id="authToggle" class="authToggle">Hesabın yok mu? Kayıt ol</div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="mainScreen" class="hidden">
    <div id="sidebar">
      <div id="sidebarHeader">
        <div class="who" id="whoLabel">—<span id="whoSub"></span></div>
        <button id="logoutBtn">Çıkış</button>
      </div>
      <div id="quotaBanner"></div>
      <div id="addContactRow">
        <input id="addContactInput" type="text" placeholder="Kullanıcı adıyla kişi ekle, Enter'a bas" />
      </div>
      <div id="contactList"></div>
    </div>

    <div id="chatArea">
      <div id="chatEmpty">Sohbet açmak için soldan bir kişi seç.</div>
      <div id="chatHeaderWrap" class="hidden" style="display:flex; flex-direction:column; min-height:0; flex:1;">
        <div id="chatHeader">
          <span id="chatHeaderName"></span>
          <button id="gameBtn" class="iconBtn" title="Oyun oyna">🎮</button>
        </div>
        <div id="adminDisclosureBanner" class="hidden">🔒 Bu sohbet yönetici hesabı tarafından da görüntülenebilir</div>
        <div id="pinnedBanner" class="hidden">
          <span>📌</span>
          <span class="txt" id="pinnedBannerText"></span>
          <span class="close" id="pinnedBannerClose" title="Sabiti kaldır">✕</span>
        </div>
        <div id="chatQuota"></div>
        <div id="globalError" class="hidden"></div>
        <div id="messages"></div>
        <button id="scrollToBottomBtn" class="hidden" title="En alta git">↓</button>
        <div id="uploadStatus" class="hidden"></div>
        <div id="replyBanner" class="hidden">
          <span>↩️</span>
          <span class="txt" id="replyBannerText"></span>
          <span class="close" id="replyBannerClose" title="Yanıtlamayı iptal et">✕</span>
        </div>
        <div id="composer">
          <button id="attachBtn" class="iconBtn" title="Fotoğraf/Video gönder">📎</button>
          <input id="fileInput" type="file" accept="image/*,video/*" class="hidden" />
          <input id="textInput" type="text" placeholder="Mesaj yaz..." />
          <button id="sendBtn">Gönder</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Game picker: choose XOX or Chess -->
  <div id="gamePickerModal" class="modalOverlay hidden">
    <div class="modalCard">
      <div class="modalHeaderRow">
        <span class="modalTitle">Oyun — <span id="gamePickerContactName"></span></span>
        <button class="modalClose" id="gamePickerClose">✕</button>
      </div>
      <button class="pickerBtn" id="pickXoxBtn">❌⭕ XOX</button>
      <button class="pickerBtn" id="pickChessBtn">♟️ Satranç</button>
    </div>
  </div>

  <!-- XOX modal -->
  <div id="xoxModal" class="modalOverlay hidden">
    <div class="modalCard">
      <div class="modalHeaderRow">
        <span class="modalTitle">XOX — <span id="xoxContactName"></span></span>
        <button class="modalClose" id="xoxClose">✕</button>
      </div>
      <div class="modalStatus" id="xoxStatus"></div>
      <div class="xoxBoard" id="xoxBoard"></div>
      <button class="modalStartBtn hidden" id="xoxStartBtn"></button>
    </div>
  </div>

  <!-- Chess modal -->
  <div id="chessModal" class="modalOverlay hidden">
    <div class="modalCard">
      <div class="modalHeaderRow">
        <span class="modalTitle">Satranç — <span id="chessContactName"></span></span>
        <button class="modalClose hidden" id="chessResetBtn" title="Sıfırla">🔄</button>
        <button class="modalClose" id="chessClose">✕</button>
      </div>
      <div class="modalStatus" id="chessStatus"></div>
      <div class="chessBoard" id="chessBoard"></div>
      <button class="modalStartBtn hidden" id="chessStartBtn"></button>
    </div>
  </div>

</div>

<div id="lightbox" class="hidden">
  <img id="lightboxImg" src="" />
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  onAuthStateChanged, signOut, setPersistence, browserLocalPersistence,
} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';
import {
  getFirestore, doc, setDoc, getDoc, getDocs, collection, addDoc, query, where,
  orderBy, limit, onSnapshot, serverTimestamp, Timestamp, increment, deleteField,
} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
import {
  getStorage, ref, uploadBytes, getDownloadURL,
} from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-storage.js';
// Same chess engine/version as the mobile app's package.json ("chess.js":
// "^1.4.0") — legality checking must agree between the two clients since
// they read/write the exact same rooms/{roomId}/game/chess Firestore doc.
import { Chess } from 'https://esm.sh/chess.js@1.4.0';

// Same project config as the mobile app (src/config/firebaseConfig.ts) —
// these are not secrets, just public client identifiers; access is gated
// entirely by Firestore/Storage security rules, same as the mobile client.
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyDcQNyvWOHFYYxC1ToBSHdl0KS62fXAKaU',
  authDomain: 'kaanchatmercan.firebaseapp.com',
  projectId: 'kaanchatmercan',
  storageBucket: 'kaanchatmercan.firebasestorage.app',
  messagingSenderId: '710001652885',
  appId: '1:710001652885:web:5f1dcd75d07c1753efd79c',
};

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

// Uid of the app's single, openly disclosed admin account (username
// "admin", created via scripts/createAdminAccount.js). NOT a secret
// backdoor — every chat room's header shows a persistent banner disclosing
// that the admin account can also read that conversation (see the
// #chatHeader / admin disclosure banner below), and the admin account has
// read-only Firestore access to every room (see firestore.rules' isAdmin()).
// Must match the identical constant in src/config/adminConfig.ts and
// web-client/src/config/adminConfig.ts.
const ADMIN_UID = '8PCGPrrJpfP2Scmw731gzsEol9H2';

// Auth's default persistence tries to open an IndexedDB connection, which is
// flaky enough on a file:// origin in Chrome to throw "Database is
// closing/hidden" and break login entirely. localStorage-based persistence
// avoids IndexedDB altogether and still survives a page reload.
setPersistence(auth, browserLocalPersistence).catch(() => undefined);

// ---- Theme (defaults to dark, same as the mobile app's default) ----
const THEME_STORAGE_KEY = 'gizlichat_pc_theme';
const themeToggleBtn = document.getElementById('themeToggle');

// localStorage can throw (private-browsing edge cases, restricted preview
// sandboxes) — theme preference is a nice-to-have, never worth crashing the
// whole module (and with it auth/Firestore) over.
function readStoredTheme() {
  try { return localStorage.getItem(THEME_STORAGE_KEY); } catch { return null; }
}
function writeStoredTheme(mode) {
  try { localStorage.setItem(THEME_STORAGE_KEY, mode); } catch { /* ignore */ }
}

function applyTheme(mode) {
  document.documentElement.setAttribute('data-theme', mode);
  themeToggleBtn.textContent = mode === 'dark' ? '☀️' : '🌙';
}
applyTheme(readStoredTheme() === 'light' ? 'light' : 'dark');
themeToggleBtn.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  writeStoredTheme(next);
});

const USERNAME_EMAIL_DOMAIN = '@gizlichat.local';
const VIDEO_QUOTA_BYTES = 5120 * 1024 * 1024;
const usernameToEmail = u => `${u.trim().toLowerCase()}${USERNAME_EMAIL_DOMAIN}`;
const roomIdFor = (a, b) => [a, b].sort().join('__');

// ---- DOM refs ----
const $ = id => document.getElementById(id);
const authScreen = $('authScreen'), mainScreen = $('mainScreen');
const authUsername = $('authUsername'), authPassword = $('authPassword');
const authSubmit = $('authSubmit'), authToggle = $('authToggle'), authError = $('authError');
const whoLabel = $('whoLabel'), whoSub = $('whoSub'), quotaBanner = $('quotaBanner');
const addContactInput = $('addContactInput'), contactList = $('contactList');
const chatEmpty = $('chatEmpty'), chatHeaderWrap = $('chatHeaderWrap'), chatHeader = $('chatHeader');
const chatHeaderName = $('chatHeaderName'), gameBtn = $('gameBtn');
const chatQuota = $('chatQuota'), messagesEl = $('messages'), globalError = $('globalError');
const scrollToBottomBtn = $('scrollToBottomBtn');
const textInput = $('textInput'), sendBtn = $('sendBtn');
const attachBtn = $('attachBtn'), fileInput = $('fileInput'), uploadStatus = $('uploadStatus');
const gamePickerModal = $('gamePickerModal'), gamePickerContactName = $('gamePickerContactName');
const pickXoxBtn = $('pickXoxBtn'), pickChessBtn = $('pickChessBtn'), gamePickerClose = $('gamePickerClose');
const xoxModal = $('xoxModal'), xoxContactName = $('xoxContactName'), xoxStatus = $('xoxStatus');
const xoxBoardEl = $('xoxBoard'), xoxStartBtn = $('xoxStartBtn'), xoxClose = $('xoxClose');
const chessModal = $('chessModal'), chessContactName = $('chessContactName'), chessStatus = $('chessStatus');
const chessBoardEl = $('chessBoard'), chessStartBtn = $('chessStartBtn'), chessClose = $('chessClose'), chessResetBtn = $('chessResetBtn');
const adminDisclosureBanner = $('adminDisclosureBanner');
const pinnedBanner = $('pinnedBanner'), pinnedBannerText = $('pinnedBannerText'), pinnedBannerClose = $('pinnedBannerClose');
const replyBanner = $('replyBanner'), replyBannerText = $('replyBannerText'), replyBannerClose = $('replyBannerClose');
const lightbox = $('lightbox'), lightboxImg = $('lightboxImg');

let isRegisterMode = false;
let myUid = null, myUsername = null;
let contacts = []; // {uid, name}
let activeContactUid = null;
let activeContact = null;
let roomUnsub = null;
let contactListUnsubs = [];
let profileUnsub = null;
let xoxUnsub = null, xoxGame = null;
let chessUnsub = null, chessGameState = null, chessSelected = null;
let pinnedUnsub = null;
let pinnedMessageId = null;
let latestMessages = []; // [{id, data}] for the currently-open room, for pin/reply jump-to lookups
let replyingTo = null; // {id, type, text, senderId}
// When this session started — only messages newer than this trigger a
// desktop notification, so re-opening the app doesn't re-notify for the
// whole existing history. Tracked per contact so a burst from the same
// sender doesn't repeat the same message id twice.
const sessionStartedAt = Date.now();
const notifiedMessageIds = new Set();

function requestNotificationPermission() {
  if (typeof Notification === 'undefined' || Notification.permission !== 'default') return;
  Notification.requestPermission().catch(() => undefined);
}

/**
 * Real OS-level desktop notification with the actual sender name and
 * message content — unlike the mobile app's deliberately-disguised fake
 * game notifications, the PC client isn't hiding behind a cover app, so
 * there's no reason to hide the content here.
 */
function showDesktopNotification(contactName, bodyText) {
  if (typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
  try {
    new Notification(`${contactName} adlı kişiden mesaj geldi`, { body: bodyText });
  } catch {
    // Notification construction can throw in some restricted contexts
    // (e.g. certain file:// sandboxes) — silently skip, not worth surfacing.
  }
}

function showError(msg) {
  globalError.textContent = msg;
  globalError.classList.remove('hidden');
  setTimeout(() => globalError.classList.add('hidden'), 5000);
}

function formatMb(bytes) { return Math.round(bytes / (1024 * 1024)); }
function renderQuota(el, usedBytes) {
  const usedMb = formatMb(usedBytes || 0);
  const totalMb = formatMb(VIDEO_QUOTA_BYTES);
  const ratio = Math.min(1, (usedBytes || 0) / VIDEO_QUOTA_BYTES);
  el.innerHTML = `geriye kalan video yükleme alanı: ${usedMb}mb / ${totalMb}mb
    <div class="track"><div class="fill" style="width:${ratio * 100}%"></div></div>`;
}

// ---- Auth ----
authToggle.addEventListener('click', () => {
  isRegisterMode = !isRegisterMode;
  authSubmit.textContent = isRegisterMode ? 'Kayıt ol' : 'Giriş yap';
  authToggle.textContent = isRegisterMode ? 'Zaten hesabın var mı? Giriş yap' : 'Hesabın yok mu? Kayıt ol';
});

authSubmit.addEventListener('click', async () => {
  const username = authUsername.value.trim();
  const password = authPassword.value;
  if (!username || !password) {
    authError.textContent = 'Kullanıcı adı ve şifre gerekli.';
    authError.classList.remove('hidden');
    return;
  }
  authSubmit.disabled = true;
  authError.classList.add('hidden');
  try {
    if (isRegisterMode) {
      const credential = await createUserWithEmailAndPassword(auth, usernameToEmail(username), password);
      await setDoc(doc(db, 'users', credential.user.uid), {
        username, usernameLower: username.toLowerCase(), createdAt: Date.now(),
      });
    } else {
      await signInWithEmailAndPassword(auth, usernameToEmail(username), password);
    }
  } catch (error) {
    authError.textContent = mapAuthError(error);
    authError.classList.remove('hidden');
  } finally {
    authSubmit.disabled = false;
  }
});

function mapAuthError(error) {
  switch (error.code) {
    case 'auth/email-already-in-use': return 'Bu kullanıcı adı zaten alınmış.';
    case 'auth/weak-password': return 'Şifre en az 6 karakter olmalı.';
    case 'auth/user-not-found':
    case 'auth/wrong-password':
    case 'auth/invalid-credential': return 'Kullanıcı adı veya şifre hatalı.';
    default: return error.message || 'Beklenmeyen bir hata oluştu.';
  }
}

$('logoutBtn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async user => {
  if (!user) {
    myUid = null;
    authScreen.classList.remove('hidden');
    mainScreen.classList.add('hidden');
    cleanupSession();
    return;
  }
  myUid = user.uid;
  const snap = await getDoc(doc(db, 'users', myUid));
  myUsername = snap.exists() && snap.data().username ? snap.data().username : user.email.split('@')[0];
  whoLabel.textContent = `Merhaba, ${myUsername}`;
  whoSub.textContent = `@${myUsername}`;
  authScreen.classList.add('hidden');
  mainScreen.classList.remove('hidden');
  startSession();
});

function cleanupSession() {
  contactListUnsubs.forEach(u => u());
  contactListUnsubs = [];
  if (roomUnsub) roomUnsub();
  if (profileUnsub) profileUnsub();
  if (xoxUnsub) xoxUnsub();
  if (pinnedUnsub) pinnedUnsub();
  if (chessUnsub) chessUnsub();
  contacts = [];
  activeContactUid = null;
  activeContact = null;
  pinnedMessageId = null;
  latestMessages = [];
  xoxGame = null;
  chessGameState = null;
  contactList.innerHTML = '';
  messagesEl.innerHTML = '';
  gamePickerModal.classList.add('hidden');
  xoxModal.classList.add('hidden');
  chessModal.classList.add('hidden');
}

function startSession() {
  requestNotificationPermission();
  profileUnsub = onSnapshot(doc(db, 'users', myUid), snap => {
    const data = snap.data() || {};
    renderQuota(quotaBanner, data.videoBytesUsed || 0);
  });

  onSnapshot(collection(db, 'users', myUid, 'contacts'), async snapshot => {
    contacts = snapshot.docs.map(d => ({ uid: d.id, name: d.data().name || 'Kişi' }));
    contacts.sort((a, b) => a.name.localeCompare(b.name, 'tr'));
    renderContactList();
  });
}

// ---- Contacts ----
addContactInput.addEventListener('keydown', async e => {
  if (e.key !== 'Enter') return;
  const username = addContactInput.value.trim();
  if (!username) return;
  addContactInput.disabled = true;
  try {
    const q = query(collection(db, 'users'), where('usernameLower', '==', username.toLowerCase()), limit(1));
    const snap = await getDocs(q);
    if (snap.empty) { showError('Bu kullanıcı adıyla bir hesap bulunamadı.'); return; }
    const found = snap.docs[0];
    if (found.id === myUid) { showError('Kendini ekleyemezsin.'); return; }
    await setDoc(doc(db, 'users', myUid, 'contacts', found.id), {
      name: found.data().username, addedAt: Date.now(), favorite: false,
    });
    addContactInput.value = '';
  } catch (error) {
    showError(`Kişi eklenemedi: ${error.message}`);
  } finally {
    addContactInput.disabled = false;
  }
});

function renderContactList() {
  contactListUnsubs.forEach(u => u());
  contactListUnsubs = [];
  contactList.innerHTML = '';
  contacts.forEach(contact => {
    const row = document.createElement('div');
    row.className = 'contactRow' + (contact.uid === activeContactUid ? ' active' : '');
    row.innerHTML = `
      <div class="avatar" id="avatar_${contact.uid}">${contact.name.slice(0, 1).toUpperCase()}</div>
      <div class="contactMeta">
        <div class="name">${escapeHtml(contact.name)}</div>
        <div class="preview" id="preview_${contact.uid}">Henüz mesaj yok</div>
      </div>`;
    row.addEventListener('click', () => openRoom(contact));
    contactList.appendChild(row);

    const roomId = roomIdFor(myUid, contact.uid);
    // Widened past 1 (same as the mobile app's subscribeToLatestMessage) so a
    // deleted message can be skipped client-side — otherwise the sidebar
    // preview would keep showing a message either side has deleted.
    const latestQ = query(collection(db, 'rooms', roomId, 'messages'), orderBy('createdAt', 'desc'), limit(20));
    contactListUnsubs.push(onSnapshot(latestQ, async snap => {
      const previewEl = document.getElementById(`preview_${contact.uid}`);
      const docSnap = snap.docs.find(d => !d.data().deleted);
      if (!docSnap) { if (previewEl) previewEl.textContent = 'Henüz mesaj yok'; return; }
      const data = docSnap.data();
      if (previewEl) previewEl.textContent = previewText(data, myUid);

      // Same suppression rule as the mobile app: no notification for a
      // message from the contact whose room is currently open on screen.
      const createdAtMs = data.createdAt instanceof Timestamp ? data.createdAt.toMillis() : Date.now();
      if (
        data.senderId !== myUid &&
        data.type !== 'call' &&
        createdAtMs > sessionStartedAt &&
        contact.uid !== activeContactUid &&
        !notifiedMessageIds.has(docSnap.id)
      ) {
        notifiedMessageIds.add(docSnap.id);
        showDesktopNotification(contact.name, previewText(data, myUid));
      }
    }));
    contactListUnsubs.push(onSnapshot(doc(db, 'users', contact.uid), snap => {
      const avatarEl = document.getElementById(`avatar_${contact.uid}`);
      if (!avatarEl) return;
      const photoUrl = snap.data()?.photoUrl;
      avatarEl.innerHTML = photoUrl ? `<img src="${photoUrl}" />` : contact.name.slice(0, 1).toUpperCase();
    }));
  });
}

function previewText(data, myUid) {
  const mine = data.senderId === myUid ? 'Sen: ' : '';
  switch (data.type) {
    case 'image': return data.hidden ? `${mine}🙈 Gizli Fotoğraf` : `${mine}📷 Fotoğraf`;
    case 'video': return `${mine}🎥 Video`;
    case 'audio': return `${mine}🎤 Sesli mesaj`;
    case 'call': return `📞 Arama`;
    case 'chess': return `${mine}♟️ Satranç daveti`;
    default: return `${mine}${data.text || ''}`;
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---- Chat room ----
function openRoom(contact) {
  activeContactUid = contact.uid;
  activeContact = contact;
  chatEmpty.classList.add('hidden');
  chatHeaderWrap.classList.remove('hidden');
  chatHeaderName.textContent = contact.name;
  renderContactList();
  cancelReply();

  // Disclosed (not secret) admin access — shown every time a room is
  // opened, skipped only when admin itself is one of the two participants.
  const showAdminDisclosure = !!ADMIN_UID && myUid !== ADMIN_UID && contact.uid !== ADMIN_UID;
  adminDisclosureBanner.classList.toggle('hidden', !showAdminDisclosure);

  if (roomUnsub) roomUnsub();
  const roomId = roomIdFor(myUid, contact.uid);
  const messagesQ = query(collection(db, 'rooms', roomId, 'messages'), orderBy('createdAt', 'desc'), limit(50));
  scrollToBottomBtn.classList.add('hidden');
  roomUnsub = onSnapshot(messagesQ, snapshot => {
    const docs = snapshot.docs.slice().reverse();
    const wasNearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
    const distanceFromBottom = messagesEl.scrollHeight - messagesEl.scrollTop;
    latestMessages = docs.map(d => ({ id: d.id, data: d.data() }));
    messagesEl.innerHTML = '';
    latestMessages
      .filter(m => !m.data.deleted)
      .forEach(m => messagesEl.appendChild(renderMessage(m.id, m.data)));
    if (wasNearBottom) {
      messagesEl.scrollTop = messagesEl.scrollHeight;
      scrollToBottomBtn.classList.add('hidden');
    } else {
      messagesEl.scrollTop = messagesEl.scrollHeight - distanceFromBottom;
      scrollToBottomBtn.classList.remove('hidden');
    }
    renderPinnedBanner();
  }, error => showError(`Sohbete bağlanılamadı: ${error.message}`));

  if (pinnedUnsub) pinnedUnsub();
  pinnedUnsub = onSnapshot(doc(db, 'rooms', roomId), snap => {
    pinnedMessageId = snap.data()?.pinnedMessageId || null;
    renderPinnedBanner();
  });

  if (xoxUnsub) xoxUnsub();
  xoxUnsub = onSnapshot(gameDocRef(roomId, 'ticTacToe'), snap => {
    xoxGame = snap.exists() ? snap.data() : null;
    if (!xoxModal.classList.contains('hidden')) renderXoxModal();
  });
  if (chessUnsub) chessUnsub();
  chessUnsub = onSnapshot(gameDocRef(roomId, 'chess'), snap => {
    chessGameState = snap.exists() ? snap.data() : null;
    if (!chessModal.classList.contains('hidden')) renderChessModal();
  });
}

function renderPinnedBanner() {
  if (!pinnedMessageId) {
    pinnedBanner.classList.add('hidden');
    return;
  }
  const found = latestMessages.find(m => m.id === pinnedMessageId);
  if (!found) {
    pinnedBanner.classList.add('hidden');
    return;
  }
  pinnedBannerText.textContent = found.data.deleted ? 'Bu mesaj silindi' : previewText(found.data, myUid);
  pinnedBanner.classList.remove('hidden');
}

pinnedBanner.addEventListener('click', e => {
  if (e.target === pinnedBannerClose) return;
  const el = messagesEl.querySelector(`[data-msg-id="${pinnedMessageId}"]`);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
});
pinnedBannerClose.addEventListener('click', async () => {
  if (!activeContactUid) return;
  const roomId = roomIdFor(myUid, activeContactUid);
  await setDoc(doc(db, 'rooms', roomId), { pinnedMessageId: deleteField() }, { merge: true });
});

async function togglePin(messageId) {
  if (!activeContactUid) return;
  const roomId = roomIdFor(myUid, activeContactUid);
  const next = pinnedMessageId === messageId ? deleteField() : messageId;
  await setDoc(doc(db, 'rooms', roomId), { pinnedMessageId: next }, { merge: true });
}

// ---- Reply ----
function setReplyingTo(id, data) {
  replyingTo = { id, type: data.type, text: data.text || '', senderId: data.senderId };
  replyBannerText.textContent = `${data.senderId === myUid ? 'Kendine' : activeContact?.name || ''} yanıtlıyorsun: ${previewText(data, myUid)}`;
  replyBanner.classList.remove('hidden');
  textInput.focus();
}
function cancelReply() {
  replyingTo = null;
  replyBanner.classList.add('hidden');
}
replyBannerClose.addEventListener('click', cancelReply);

function replyQuoteHtml(replyTo) {
  if (!replyTo) return '';
  const senderLabel = replyTo.senderId === myUid ? 'Sen' : (activeContact?.name || 'O');
  const label = previewText({ type: replyTo.type, text: replyTo.text, senderId: replyTo.senderId }, myUid).replace(/^Sen: /, '');
  return `<div class="replyQuote"><div class="sender">${escapeHtml(senderLabel)}</div><div class="txt">${escapeHtml(label)}</div></div>`;
}

messagesEl.addEventListener('scroll', () => {
  const nearBottom = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 80;
  scrollToBottomBtn.classList.toggle('hidden', nearBottom);
});
scrollToBottomBtn.addEventListener('click', () => {
  messagesEl.scrollTop = messagesEl.scrollHeight;
  scrollToBottomBtn.classList.add('hidden');
});

function formatTime(ts) {
  const ms = ts instanceof Timestamp ? ts.toMillis() : (typeof ts === 'number' ? ts : Date.now());
  const d = new Date(ms);
  return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
}

function renderMessage(id, data) {
  const row = document.createElement('div');
  row.className = 'msgRow' + (data.senderId === myUid ? ' mine' : '');
  row.dataset.msgId = id;

  // Call/chess entries render as a plain centered pill, same as the mobile app — no reply/pin actions on those.
  if (data.type === 'call') {
    const pill = document.createElement('div');
    pill.className = 'pillMsg';
    pill.textContent = `${data.callVideo ? '🎥 Görüntülü' : '📞 Sesli'} arama`;
    row.style.justifyContent = 'center';
    row.appendChild(pill);
    return row;
  }
  if (data.type === 'chess') {
    const pill = document.createElement('div');
    pill.className = 'pillMsg';
    pill.textContent = data.senderId === myUid ? '♟️ Satranç daveti gönderdin' : '♟️ Satranç daveti aldın';
    row.style.justifyContent = 'center';
    row.appendChild(pill);
    return row;
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = replyQuoteHtml(data.replyTo);

  if (data.type === 'image' && data.hidden && data.mediaUrl) {
    const pill = document.createElement('div');
    pill.className = 'hiddenPill';
    pill.innerHTML = `<span class="icon">🙈</span><div><div class="label">Gizli Fotoğraf</div><div class="hint">Görmek için tıkla</div></div>`;
    pill.addEventListener('click', () => {
      lightboxImg.src = data.mediaUrl;
      lightbox.classList.remove('hidden');
    });
    bubble.appendChild(pill);
  } else if (data.type === 'image' && data.mediaUrl) {
    bubble.innerHTML += `<img src="${data.mediaUrl}" />`;
  } else if (data.type === 'video' && data.mediaUrl) {
    bubble.innerHTML += `<video src="${data.mediaUrl}" controls></video>`;
  } else if (data.type === 'audio' && data.mediaUrl) {
    bubble.innerHTML += `<audio src="${data.mediaUrl}" controls></audio>`;
  } else {
    bubble.appendChild(document.createTextNode(data.text || ''));
  }

  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = formatTime(data.createdAt);
  bubble.appendChild(time);
  row.appendChild(bubble);

  const actions = document.createElement('div');
  actions.className = 'msgActions';
  const replyBtn = document.createElement('button');
  replyBtn.title = 'Yanıtla';
  replyBtn.textContent = '↩️';
  replyBtn.addEventListener('click', () => setReplyingTo(id, data));
  const pinBtn = document.createElement('button');
  pinBtn.title = pinnedMessageId === id ? 'Sabiti kaldır' : 'Sabitle';
  pinBtn.textContent = '📌';
  pinBtn.addEventListener('click', () => togglePin(id));
  actions.appendChild(replyBtn);
  actions.appendChild(pinBtn);
  row.appendChild(actions);

  return row;
}

lightbox.addEventListener('click', () => lightbox.classList.add('hidden'));

// Firestore'un tek doküman limiti 1 MiB — base64 encoding ham veriyi ~%33
// büyüttüğü için bu eşik, diğer mesaj alanları için de pay bırakacak
// şekilde 900.000 karakterde (data URI önekiyle birlikte) tutuluyor.
const MAX_INLINE_IMAGE_DATA_URI_LENGTH = 900000;

// ---- Sending ----
async function sendText() {
  const trimmed = textInput.value.trim();
  if (!trimmed || !activeContactUid) return;
  textInput.value = '';
  const roomId = roomIdFor(myUid, activeContactUid);
  const reply = replyingTo;
  cancelReply();
  try {
    const replyToPayload = reply
      ? { id: reply.id, type: reply.type, senderId: reply.senderId, text: reply.text }
      : null;
    await addDoc(collection(db, 'rooms', roomId, 'messages'), {
      type: 'text', text: trimmed, senderId: myUid, createdAt: serverTimestamp(),
      ...(replyToPayload ? { replyTo: replyToPayload } : {}),
    });
  } catch (error) {
    showError(`Mesaj gönderilemedi: ${error.message}`);
  }
}
sendBtn.addEventListener('click', sendText);
textInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  fileInput.value = '';
  if (!file || !activeContactUid) return;
  const roomId = roomIdFor(myUid, activeContactUid);
  const isVideo = file.type.startsWith('video');
  uploadStatus.textContent = 'Gönderiliyor…';
  uploadStatus.classList.remove('hidden');
  try {
    if (isVideo) {
      const ext = (file.name.split('.').pop() || 'mp4');
      const path = `rooms/${roomId}/media/video/${Date.now()}-${Math.random().toString(36).slice(2, 10)}.${ext}`;
      const storageRef = ref(storage, path);
      await uploadBytes(storageRef, file, { contentType: file.type || undefined });
      const url = await getDownloadURL(storageRef);
      await addDoc(collection(db, 'rooms', roomId, 'messages'), {
        type: 'video', text: '', senderId: myUid, createdAt: serverTimestamp(), mediaUrl: url,
      });
      await setDoc(doc(db, 'users', myUid), { videoBytesUsed: increment(file.size) }, { merge: true });
    } else {
      const dataUri = await resizeImageToDataUri(file, 1280, 0.7);
      if (dataUri.length > MAX_INLINE_IMAGE_DATA_URI_LENGTH) {
        showError('Fotoğraf çok büyük, daha düşük çözünürlüklü bir fotoğraf seç.');
        return;
      }
      const hidden = window.confirm('Bu fotoğrafı gizli olarak mı göndermek istiyorsun? (Karşı taraf dokunana kadar görünmez)');
      await addDoc(collection(db, 'rooms', roomId, 'messages'), {
        type: 'image', text: '', senderId: myUid, createdAt: serverTimestamp(), mediaUrl: dataUri,
        ...(hidden ? { hidden: true } : {}),
      });
    }
  } catch (error) {
    showError(`Medya gönderilemedi: ${error.message}`);
  } finally {
    uploadStatus.classList.add('hidden');
  }
});

function resizeImageToDataUri(file, maxSize, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error('Dosya okunamadı.'));
    reader.onload = () => { img.src = reader.result; };
    img.onerror = () => reject(new Error('Görsel işlenemedi.'));
    img.onload = () => {
      let { width, height } = img;
      if (width > maxSize || height > maxSize) {
        const scale = maxSize / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    reader.readAsDataURL(file);
  });
}

// ---- Games: XOX + Satranç (contact mode) ----
// Both read/write the exact same rooms/{roomId}/game/{ticTacToe|chess} docs
// as the mobile app's ticTacToeService.ts / chessService.ts (contact mode
// only — no room-code matchmaking here) — a PC user and a phone user can
// play each other, same Firestore doc as single source of truth.
function gameDocRef(roomId, kind) {
  return doc(db, 'rooms', roomId, 'game', kind);
}

function closeAllGameModals() {
  gamePickerModal.classList.add('hidden');
  xoxModal.classList.add('hidden');
  chessModal.classList.add('hidden');
  chessSelected = null;
}

gameBtn.addEventListener('click', () => {
  if (!activeContact) return;
  gamePickerContactName.textContent = activeContact.name;
  gamePickerModal.classList.remove('hidden');
});
gamePickerClose.addEventListener('click', closeAllGameModals);
gamePickerModal.addEventListener('click', e => { if (e.target === gamePickerModal) closeAllGameModals(); });

pickXoxBtn.addEventListener('click', () => {
  gamePickerModal.classList.add('hidden');
  xoxContactName.textContent = activeContact.name;
  xoxModal.classList.remove('hidden');
  renderXoxModal();
});
xoxClose.addEventListener('click', closeAllGameModals);
xoxModal.addEventListener('click', e => { if (e.target === xoxModal) closeAllGameModals(); });

pickChessBtn.addEventListener('click', () => {
  gamePickerModal.classList.add('hidden');
  chessContactName.textContent = activeContact.name;
  chessSelected = null;
  chessModal.classList.remove('hidden');
  renderChessModal();
});
chessClose.addEventListener('click', closeAllGameModals);
chessResetBtn.addEventListener('click', resetChessGame);
chessModal.addEventListener('click', e => { if (e.target === chessModal) closeAllGameModals(); });

// ---- XOX ----
const XOX_WIN_LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function xoxWinLine(board, mark) {
  return XOX_WIN_LINES.find(line => line.every(i => board[i] === mark)) || null;
}

async function startXoxGame() {
  const roomId = roomIdFor(myUid, activeContactUid);
  await setDoc(gameDocRef(roomId, 'ticTacToe'), {
    board: Array(9).fill(null), playerX: myUid, playerO: activeContactUid,
    turnUid: myUid, status: 'active', outcome: null, updatedAt: serverTimestamp(),
  });
}

async function playXoxMove(index) {
  const game = xoxGame;
  if (!game || game.status !== 'active' || game.turnUid !== myUid || game.board[index]) return;
  const myMark = game.playerX === myUid ? 'X' : 'O';
  const nextBoard = game.board.slice();
  nextBoard[index] = myMark;
  const won = xoxWinLine(nextBoard, myMark);
  const isDraw = !won && nextBoard.every(c => c !== null);
  const opponentUid = myMark === 'X' ? game.playerO : game.playerX;
  const roomId = roomIdFor(myUid, activeContactUid);
  await setDoc(gameDocRef(roomId, 'ticTacToe'), {
    board: nextBoard, playerX: game.playerX, playerO: game.playerO,
    turnUid: won || isDraw ? game.turnUid : opponentUid,
    status: won || isDraw ? 'finished' : 'active',
    outcome: won ? (myMark === 'X' ? 'x' : 'o') : (isDraw ? 'draw' : null),
    updatedAt: serverTimestamp(),
  });
}

function renderXoxModal() {
  const game = xoxGame;
  const myMark = game && game.playerX === myUid ? 'X' : (game && game.playerO === myUid ? 'O' : null);
  const isMyTurn = !!game && game.status === 'active' && game.turnUid === myUid;
  const winLine = (game && game.status === 'finished' && game.outcome && game.outcome !== 'draw')
    ? xoxWinLine(game.board, game.outcome === 'x' ? 'X' : 'O') : null;

  if (!game || game.status === 'finished') {
    xoxStatus.textContent = game
      ? (game.outcome === 'draw' ? 'Berabere' : (((game.outcome === 'x' && myMark === 'X') || (game.outcome === 'o' && myMark === 'O')) ? 'Kazandın! 🎉' : `${activeContact.name} kazandı`))
      : `${activeContact.name} ile yeni bir oyun başlat`;
  } else {
    xoxStatus.textContent = isMyTurn ? 'Sırası sende' : `Sırası ${activeContact.name}'da`;
  }

  xoxBoardEl.innerHTML = '';
  for (let row = 0; row < 3; row++) {
    const rowEl = document.createElement('div');
    rowEl.className = 'xoxRow';
    for (let col = 0; col < 3; col++) {
      const i = row * 3 + col;
      const cell = game ? game.board[i] : null;
      const cellEl = document.createElement('div');
      cellEl.className = 'xoxCell' + (cell === 'X' ? ' x' : cell === 'O' ? ' o' : '') + (winLine && winLine.includes(i) ? ' win' : '');
      cellEl.textContent = cell || '';
      cellEl.addEventListener('click', () => playXoxMove(i));
      rowEl.appendChild(cellEl);
    }
    xoxBoardEl.appendChild(rowEl);
  }

  if (!game || game.status === 'finished') {
    xoxStartBtn.textContent = game ? 'YENİDEN OYNA' : 'OYUNU BAŞLAT';
    xoxStartBtn.classList.remove('hidden');
    xoxStartBtn.onclick = startXoxGame;
  } else {
    xoxStartBtn.classList.add('hidden');
  }
}

// ---- Chess ----
const CHESS_FILES = ['a','b','c','d','e','f','g','h'];
const CHESS_PIECE_GLYPHS = {
  wk: '♔', wq: '♕', wr: '♖', wb: '♗', wn: '♘', wp: '♙',
  bk: '♚', bq: '♛', br: '♜', bb: '♝', bn: '♞', bp: '♟',
};

async function startChessGame() {
  const roomId = roomIdFor(myUid, activeContactUid);
  await setDoc(gameDocRef(roomId, 'chess'), {
    fen: new Chess().fen(), playerWhite: myUid, playerBlack: activeContactUid,
    status: 'active', outcome: null, updatedAt: serverTimestamp(),
  });
}

async function resetChessGame() {
  const game = chessGameState;
  if (!game) return;
  const roomId = roomIdFor(myUid, activeContactUid);
  await setDoc(gameDocRef(roomId, 'chess'), {
    fen: new Chess().fen(), playerWhite: game.playerWhite, playerBlack: game.playerBlack,
    status: 'active', outcome: null, updatedAt: serverTimestamp(),
  });
}

async function playChessMove(from, to) {
  const game = chessGameState;
  if (!game || game.status !== 'active') return;
  const isWhite = game.playerWhite === myUid;
  const chess = new Chess(game.fen);
  if ((chess.turn() === 'w') !== isWhite) return;
  try {
    chess.move({ from, to, promotion: 'q' });
  } catch {
    return; // illegal move — ignore the click, same trust model as chessService.ts
  }
  let outcome = null;
  if (chess.isCheckmate()) outcome = isWhite ? 'white' : 'black';
  else if (chess.isDraw() || chess.isStalemate()) outcome = 'draw';
  const roomId = roomIdFor(myUid, activeContactUid);
  await setDoc(gameDocRef(roomId, 'chess'), {
    fen: chess.fen(), status: chess.isGameOver() ? 'finished' : 'active', outcome, updatedAt: serverTimestamp(),
  }, { merge: true });
}

function renderChessModal() {
  const game = chessGameState;
  const myColor = game ? (game.playerWhite === myUid ? 'w' : (game.playerBlack === myUid ? 'b' : null)) : null;
  const fen = game ? game.fen : new Chess().fen();
  const chess = new Chess(fen);
  const isMyTurn = !!game && game.status === 'active' && !!myColor && chess.turn() === myColor;

  if (!game || game.status === 'finished') {
    chessStatus.textContent = game
      ? (game.outcome === 'draw' ? 'Berabere' : (((game.outcome === 'white' && myColor === 'w') || (game.outcome === 'black' && myColor === 'b')) ? 'Kazandın! 🎉' : `${activeContact.name} kazandı`))
      : `${activeContact.name} ile yeni bir oyun başlat`;
  } else {
    chessStatus.textContent = isMyTurn ? 'Sırası sende' : `Sırası ${activeContact.name}'da`;
  }

  const legalTargets = chessSelected && isMyTurn
    ? new Set(chess.moves({ square: chessSelected, verbose: true }).map(m => m.to))
    : new Set();

  const ranks = myColor === 'b' ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
  const files = myColor === 'b' ? [...CHESS_FILES].reverse() : CHESS_FILES;

  chessBoardEl.innerHTML = '';
  ranks.forEach(rank => {
    const rowEl = document.createElement('div');
    rowEl.className = 'chessRowEl';
    files.forEach(file => {
      const square = `${file}${rank}`;
      const piece = chess.get(square);
      const isDark = (CHESS_FILES.indexOf(file) + rank) % 2 === 1;
      const sqEl = document.createElement('div');
      sqEl.className = 'chessSquare ' + (isDark ? 'dark' : 'light')
        + (chessSelected === square ? ' selected' : '')
        + (legalTargets.has(square) ? ' target' : '');
      if (piece) {
        const glyph = document.createElement('span');
        glyph.className = 'piece';
        glyph.textContent = CHESS_PIECE_GLYPHS[`${piece.color}${piece.type}`];
        sqEl.appendChild(glyph);
      }
      sqEl.addEventListener('click', () => handleChessSquareClick(square));
      rowEl.appendChild(sqEl);
    });
    chessBoardEl.appendChild(rowEl);
  });

  if (!game || game.status === 'finished') {
    chessStartBtn.textContent = game ? 'YENİDEN OYNA' : 'OYUNU BAŞLAT';
    chessStartBtn.classList.remove('hidden');
    chessStartBtn.onclick = startChessGame;
  } else {
    chessStartBtn.classList.add('hidden');
  }
  chessResetBtn.classList.toggle('hidden', !game);
}

function handleChessSquareClick(square) {
  const game = chessGameState;
  if (!game || game.status !== 'active') return;
  const myColor = game.playerWhite === myUid ? 'w' : (game.playerBlack === myUid ? 'b' : null);
  const chess = new Chess(game.fen);
  const isMyTurn = !!myColor && chess.turn() === myColor;
  if (!isMyTurn) return;

  if (chessSelected) {
    const legalTargets = new Set(chess.moves({ square: chessSelected, verbose: true }).map(m => m.to));
    if (legalTargets.has(square)) {
      const from = chessSelected;
      chessSelected = null;
      playChessMove(from, square);
      return;
    }
  }
  const piece = chess.get(square);
  chessSelected = (piece && piece.color === myColor) ? square : null;
  renderChessModal();
}
